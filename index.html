<!DOCTYPE html>
<html>
<head>
  <title>Merlin Bug Dashboard</title>
  <p id="last-updated" style="color:#888; font-size:13px; margin-top:-8px;">Last updated: —</p>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Merlin Bug & Error Dashboard</h1>
  <a href="/logout" style="position:absolute; top:20px; right:20px; padding:8px 16px; background:#e74c3c; color:white; text-decoration:none; border-radius:4px; font-size:14px;">Logout</a>

  <div class="tiles">
    <div class="tile">
      <div class="num" id="t-total">0</div>
      <div class="label">Total Bugs</div>
    </div>
    <div class="tile danger">
      <div class="num" id="t-p0">0</div>
      <div class="label">P0 (Critical)</div>
    </div>
    <div class="tile">
      <div class="num" id="t-new">0</div>
      <div class="label">New / Open</div>
    </div>
    <div class="tile">
      <div class="num" id="t-sources">0</div>
      <div class="label">Sources</div>
    </div>
  </div>

  <div class="status-row">
    <div class="status-pill new" data-status="New">
      <span class="s-count" id="s-new">0</span> New
    </div>
    <div class="status-pill prog" data-status="In progress">
      <span class="s-count" id="s-prog">0</span> In progress
    </div>
    <div class="status-pill done" data-status="Done">
      <span class="s-count" id="s-done">0</span> Done
    </div>
  </div>

  <button class="open-btn" id="open-modal">+ Add Bug</button>
  <button class="arch-toggle" id="arch-toggle">Show Archived</button>
  <button class="download-btn" id="download-btn">Download CSV</button>

  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h3>Add a bug manually</h3>
      <input id="f-endpoint" placeholder="Endpoint (e.g. /api/invoices)">
      <input id="f-message" placeholder="Message">
      <input id="f-source" placeholder="Source (e.g. WhatsApp)">
      <input id="f-priority" placeholder="Priority (e.g. P2)">
      <input id="f-account" placeholder="Account">
      <div class="modal-actions">
        <button id="add-btn">Add Bug</button>
        <button id="close-modal">Cancel</button>
      </div>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Source</label>
      <div id="source-checks" class="source-checks"></div>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select id="filter-status">
        <option value="">All</option>
        <option value="New">New</option>
        <option value="In progress">In progress</option>
        <option value="Done">Done</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Priority</label>
      <select id="filter-priority">
        <option value="">All</option>
        <option value="P0">P0</option>
        <option value="P1">P1</option>
        <option value="P2">P2</option>
        <option value="P3">P3</option>
      </select>
    </div>
  </div>

  <div id="active-filters" class="active-filters"></div>

  <div class="charts-row">
    <div class="chart-box">
      <h3>Errors by Source</h3>
      <canvas id="source-chart"></canvas>
    </div>
    <div class="chart-box">
      <h3>Errors by Priority</h3>
      <canvas id="priority-chart"></canvas>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Endpoint</th>
        <th>Message</th>
        <th>Source</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Count</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bug-rows"></tbody>
  </table>

  <div id="pagination" class="pagination"></div>

  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-panel">
      <button class="detail-close" id="detail-close">✕</button>
      <h2 id="detail-title">Bug details</h2>
      <div id="detail-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
